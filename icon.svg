<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a5e"/>
      <stop offset="1" stop-color="#3d1f6e"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5fd0ff"/>
      <stop offset="1" stop-color="#b48cff"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- bridge deck -->
  <rect x="22" y="82" width="84" height="7" rx="3.5" fill="#e8ecff"/>
  <!-- main arch -->
  <path d="M 26 82 Q 64 26 102 82" fill="none" stroke="url(#arch)" stroke-width="7" stroke-linecap="round"/>
  <!-- suspenders -->
  <line x1="42" y1="63" x2="42" y2="82" stroke="#8fb7ff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="64" y1="54" x2="64" y2="82" stroke="#8fb7ff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="86" y1="63" x2="86" y2="82" stroke="#8fb7ff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- anchor nodes -->
  <circle cx="26" cy="85" r="7" fill="#5fd0ff"/>
  <circle cx="102" cy="85" r="7" fill="#b48cff"/>
  <!-- anti-gravity spark rising above the arch -->
  <path d="M 64 14 L 69 24 L 64 21 L 59 24 Z" fill="#ffd76a"/>
  <circle cx="64" cy="30" r="2.4" fill="#ffd76a" opacity="0.85"/>
</svg>
